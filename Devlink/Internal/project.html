<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="color-scheme" content="dark">
  <title>Project</title>
  <link rel="stylesheet" href="devlink://internal.css">
</head>
<body class="project-page">
  <div class="pj">
    <!-- ① 이름 / ③ 보기·설정 -->
    <!-- 왼쪽: 이름 + 대표 도메인 (폭은 설정 입력란과 같게) · 오른쪽 옆: 설명 (아래를 대표 도메인 줄에 맞춤) -->
    <!-- ‹ Projects·머리(이름·설명·보기·설정)·환경 탭은 스크롤해도 위에 고정 -->
    <div class="pj-sticky">
    <button id="back" class="back" title="Project list" data-i18n-title>‹ Projects</button>
    <div class="pj-head pj-top">
      <div class="pj-title">
        <div class="pj-title-row">
          <h1 id="pjName"></h1>
          <span id="pjClosed" class="pj-closed" title="Closed" data-i18n-title hidden>🔒</span>
        </div>
        <p id="pjDomain" class="pj-domain"></p>
      </div>
      <div id="pjDesc" class="pj-desc"></div>
      <!-- 보기: 탭형(환경 하나) / 목록형(환경 전체) -->
      <div class="view-toggle">
        <button id="viewTabs" title="Tabs" data-i18n-title><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M9 4v5"/></svg></button>
        <button id="viewList" title="List" data-i18n-title><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01"/></svg></button>
      </div>
      <button id="pjSettings" class="gear" title="Settings" data-i18n-title><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button>
    </div>
    <!-- ④ 환경 탭 -->
    <nav id="envTabs" class="env-tabs"></nav>
    </div>

    <!-- ⑤ 도메인(서비스)별 URI 표 (목록형이면 환경마다) -->
    <div id="envBody"></div>
  </div>
  <div id="toast" class="toast" hidden></div>

  <script src="devlink://project.js"></script>
</body>
</html>
